<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · 顺手：写信与关注分两栏</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
  .hello { padding: 96px var(--x) 120px; }
  .hello .h2 { font-size: clamp(56px, 7.22vw, 104px); }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) var(--col-r); gap: 48px; margin-top: 64px; }
  .lab { color: var(--ink-2); margin-bottom: 18px; }

  /* 左：两个邮箱，Gmail 为主 */
  .mail { font-family: var(--sans); font-weight: 500; font-size: clamp(26px, 3.06vw, 44px); letter-spacing: -.02em; color: var(--blue); border-bottom: 1.5px solid var(--blue); padding-bottom: 4px; }
  .alt { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
  .mail-2 { font-family: var(--sans); font-weight: 500; font-size: 20px; color: var(--blue); border-bottom: 1px solid var(--blue); padding-bottom: 2px; }
  .alt .mono { color: var(--ink-2); }
  .copy { margin-top: 26px; color: var(--ink-2); display: flex; gap: 10px; min-height: 24px; }
  .copy:hover .t { color: var(--ink); }
  .alt .copy { margin-top: 0; }

  /* 右：去哪里看我，一行一个平台 */
  .list li { border-top: 1px solid var(--rule); }
  .list li:last-child { border-bottom: 1px solid var(--rule); }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 4px 16px; width: 100%; padding: 14px 0; text-align: left; }
  .row:hover .n { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1px; }
  .n { font-size: 20px; }
  .what { grid-column: 1; color: var(--ink-2); font-size: 12px; }
  .h { grid-row: 1 / 3; grid-column: 2; align-self: center; color: var(--ink-2); }
  .wx-qr { display: grid; grid-template-rows: 0fr; transition: grid-template-rows var(--t-slow) var(--ease); }
  .wx-qr > div { overflow: hidden; }
  .open .wx-qr { grid-template-rows: 1fr; }
  .wx-qr figure { display: flex; gap: 20px; align-items: end; padding: 4px 0 18px; }
  .wx-qr img { width: 132px; height: 132px; }
  .wx-qr figcaption { color: var(--ink-2); max-width: 18em; font-family: var(--sans); font-size: 15px; line-height: 1.5; }

  @media (max-width: 760px) {
    .hello { padding-top: 64px; }
    .body { grid-template-columns: 1fr; margin-top: 40px; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="hello" aria-labelledby="h">
    <h2 class="h2" id="h">Say <em>hello.</em></h2>
    <div class="body">
      <div>
        <p class="lab mono">Write to me</p>
        <a class="mail" href="#gmail">re11.zhou@gmail.com</a>
        <button class="copy mono" type="button" data-copy="re11.zhou@gmail.com"><span class="t">Copy address</span><span class="copied" aria-live="polite">Copied</span></button>
        <div class="alt">
          <a class="mail-2" href="#qq">re11.zhou@qq.com</a>
          <span class="mono">From China</span>
          <button class="copy mono" type="button" data-copy="re11.zhou@qq.com"><span class="t">Copy</span><span class="copied" aria-live="polite">Copied</span></button>
        </div>
      </div>
      <div>
        <p class="lab mono">Follow along</p>
        <ul class="list" aria-label="Elsewhere">
          <li><a class="row" href="#github"><span class="n">GitHub</span><span class="what mono">Code and projects</span><span class="h mono">Haoo-7 ↗</span></a></li>
          <li><a class="row" href="#sspai"><span class="n">sspai</span><span class="what mono">Long reads · 中文</span><span class="h mono">Haoo_7 ↗</span></a></li>
          <li><a class="row" href="#bili"><span class="n">Bilibili</span><span class="what mono">Videos · 中文</span><span class="h mono">Haoo_117c ↗</span></a></li>
          <li><a class="row" href="#xhs"><span class="n">Xiaohongshu</span><span class="what mono">Short notes · 中文</span><span class="h mono">Open ↗</span></a></li>
          <li class="wx">
            <button class="row" type="button" aria-expanded="false" aria-controls="wx-qr"><span class="n">WeChat</span><span class="what mono">Official account · 中文</span><span class="h mono">Scan ↓</span></button>
            <div class="wx-qr" id="wx-qr"><div><figure><img class="qr" src="assets/wechat-qr.png" width="132" height="132" alt="QR code for Haoo's WeChat official account"><figcaption>Scan with WeChat. Essays land here the same day they go up.</figcaption></figure></div></div>
          </li>
        </ul>
      </div>
    </div>
  </section>
</main>
<script>
  document.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', () => {
    navigator.clipboard?.writeText(b.dataset.copy).catch(() => {});
    b.classList.add('done'); setTimeout(() => b.classList.remove('done'), 1600);
  }));
  const wx = document.querySelector('.wx'), btn = wx.querySelector('button');
  const set = (o) => { wx.classList.toggle('open', o); btn.setAttribute('aria-expanded', o); btn.querySelector('.h').textContent = o ? 'Close ↑' : 'Scan ↓'; };
  btn.addEventListener('click', () => set(!wx.classList.contains('open')));
  if (new URLSearchParams(location.search).get('qr') === '1') set(true);
</script>
</body>
</html>
