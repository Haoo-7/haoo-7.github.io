<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>邮票版 · 生图 + 官方图标</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/stamps.css">
</head>
<body>
<main class="page">
  <section class="hello" aria-labelledby="h">
    <div>
      <h2 class="h2" id="h">Say <em>hello.</em></h2>
      <p class="lede">Seven ways to reach me, one stamp each. Pick one and it gets franked.</p>
      <a class="mail" href="#gmail">re11.zhou@gmail.com</a>
      <button class="copy-l mono" type="button" data-copy="re11.zhou@gmail.com"><span class="t">Copy address</span></button>
    </div>
    <div class="sheet">
      <p class="sel t mono"><span>Haoo · Elsewhere</span><span>Set of 7 · 2026</span></p>
      <div class="grid">
          <button class="stamp" type="button" style="--r:-1.4deg" data-copy="re11.zhou@gmail.com" aria-label="Copy re11.zhou@gmail.com">
            <span class="card"><span class="side front"><span class="vig"><img class="ico" src="assets/icons/gmail.svg" alt=""><span class="nm">Gmail</span></span><span class="car">re11.zhou@gmail</span></span></span>
            <span class="pm" aria-hidden="true"></span>
          </button>
          <button class="stamp" type="button" style="--r:.9deg" data-copy="re11.zhou@qq.com" aria-label="Copy re11.zhou@qq.com">
            <span class="card"><span class="side front"><span class="vig"><img class="ico" src="assets/icons/qq.svg" alt=""><span class="nm">QQ Mail</span></span><span class="car">re11.zhou@qq</span></span></span>
            <span class="pm" aria-hidden="true"></span>
          </button>
          <button class="stamp" type="button" style="--r:-.6deg" data-href="https://github.com/Haoo-7" aria-label="GitHub, Haoo-7, opens in a new tab">
            <span class="card"><span class="side front"><span class="vig"><img class="ico" src="assets/icons/github.svg" alt=""><span class="nm">GitHub</span></span><span class="car">Haoo-7</span></span></span>
            <span class="pm" aria-hidden="true"></span>
          </button>
          <button class="stamp" type="button" style="--r:1.3deg" data-href="https://sspai.com/u/6veuyub4/updates" aria-label="sspai, Haoo_7, opens in a new tab">
            <span class="card"><span class="side front"><span class="vig"><img class="ico" src="assets/icons/sspai.svg" alt=""><span class="nm">sspai</span></span><span class="car">Haoo_7</span></span></span>
            <span class="pm" aria-hidden="true"></span>
          </button>
          <button class="stamp" type="button" style="--r:.5deg" data-href="https://space.bilibili.com/438365760" aria-label="Bilibili, Haoo_117c, opens in a new tab">
            <span class="card"><span class="side front"><span class="vig"><img class="ico" src="assets/icons/bilibili.svg" alt=""><span class="nm">Bilibili</span></span><span class="car">Haoo_117c</span></span></span>
            <span class="pm" aria-hidden="true"></span>
          </button>
          <button class="stamp" type="button" style="--r:-1.1deg" data-href="https://www.xiaohongshu.com/user/profile/65464d64000000000d005c9b" aria-label="Xiaohongshu, Haoo, opens in a new tab">
            <span class="card"><span class="side front"><span class="vig"><img class="ico wide" src="assets/icons/xiaohongshu.svg" alt=""><span class="nm sr-only">Xiaohongshu</span></span><span class="car">Haoo</span></span></span>
            <span class="pm" aria-hidden="true"></span>
          </button>
          <button class="stamp" type="button" style="--r:1deg" data-flip aria-pressed="false" aria-label="WeChat official account, show QR code">
            <span class="card"><span class="side front"><span class="vig"><img class="ico" src="assets/icons/wechat.svg" alt=""><span class="nm">WeChat</span></span><span class="car">公众号</span></span><div class="side back"><img src="assets/wechat-qr.png" width="430" height="430" alt="QR code for Haoo's WeChat official account"><span>SCAN · 公众号</span></div></span>
            <span class="pm" aria-hidden="true"></span>
          </button>
          <div class="clock" aria-label="Local time in Guangzhou"><div class="ring"><b data-time>--:--</b><span>GUANGZHOU</span></div></div>
      </div>
      <p class="sel b mono" aria-live="polite"><span data-msg>Printed in Guangzhou</span><span>UTC+8</span></p>
    </div>
  </section>
</main>
<script src="assets/stamps.js"></script>
</body>
</html>
